<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI∩* Survey Dashboard (Internal)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a10;
  --surface: #111118;
  --card: #16161f;
  --border: rgba(255,255,255,0.08);
  --text: #e0e0e8;
  --text-mid: #8a8aa0;
  --text-dim: #4a4a60;
  --accent: #00f2ff;
  --green: #28c840;
  --amber: #f0a04a;
  --signal: #ff5252;
  --claude: #d4845a;
  --gpt: #74aa9c;
  --gemini: #8b9cf7;
  --llama: #a78bfa;
  --mistral: #f97316;
  --font: 'IBM Plex Sans', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
  --display: 'Space Grotesk', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.6; }

.header {
  padding: 1.5rem 2rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
}

.header h1 {
  font-family: var(--display);
  font-size: 1.2rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.header h1 .badge {
  font-family: var(--mono);
  font-size: 0.6rem;
  padding: 0.2rem 0.5rem;
  background: rgba(255,82,82,0.12);
  color: var(--signal);
  border: 1px solid rgba(255,82,82,0.2);
  border-radius: 2px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.header-meta {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text-dim);
}

.main { padding: 2rem; max-width: 1400px; margin: 0 auto; }

/* Overview cards */
.overview {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1rem;
  margin-bottom: 2rem;
}

.ov-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1.2rem;
}

.ov-label {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 0.4rem;
}

.ov-value {
  font-family: var(--display);
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent);
}

.ov-value.green { color: var(--green); }
.ov-value.amber { color: var(--amber); }

/* Tabs */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}

.tab {
  padding: 0.7rem 1.5rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}

.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* Response cards */
.respondent-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
  gap: 1.5rem;
}

.respondent-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.respondent-header {
  padding: 1rem 1.2rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.015);
}

.respondent-name {
  font-family: var(--display);
  font-weight: 600;
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.provider-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.respondent-meta {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--text-dim);
}

.respondent-body { padding: 1.2rem; }

.field-group {
  margin-bottom: 1.2rem;
}

.field-group:last-child { margin-bottom: 0; }

.field-group-title {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.6rem;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid rgba(0, 242, 255, 0.1);
}

.field {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 0.5rem;
  padding: 0.3rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  font-size: 0.8rem;
}

.field:last-child { border-bottom: none; }

.field-key {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text-dim);
  word-break: break-word;
}

.field-val {
  color: var(--text);
  word-break: break-word;
}

.field-val.enum {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--green);
}

/* Ratings bar */
.rating-bar {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.rating-bar .bar {
  height: 6px;
  background: var(--accent);
  border-radius: 1px;
  opacity: 0.8;
}

.rating-bar .val {
  font-family: var(--mono);
  font-size: 0.65rem;
  color: var(--text-mid);
  min-width: 1.5rem;
}

/* Free text */
.free-text {
  font-size: 0.8rem;
  color: var(--text);
  line-height: 1.65;
  font-style: italic;
  padding: 0.6rem 0.8rem;
  background: rgba(255,255,255,0.02);
  border-left: 2px solid var(--border);
  border-radius: 0 2px 2px 0;
  margin: 0.3rem 0;
  max-height: 120px;
  overflow-y: auto;
}

/* Comparison table */
.compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}

.compare-table th {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 0.6rem 0.8rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.02);
  position: sticky;
  top: 0;
}

.compare-table td {
  padding: 0.5rem 0.8rem;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  vertical-align: top;
}

.compare-table tr:hover td { background: rgba(255,255,255,0.02); }

/* Ratings comparison */
.ratings-grid {
  display: grid;
  grid-template-columns: 180px repeat(var(--agents), 1fr);
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.ratings-grid .rg-header {
  background: rgba(255,255,255,0.03);
  padding: 0.6rem 0.8rem;
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
}

.ratings-grid .rg-cell {
  padding: 0.5rem 0.8rem;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  border-left: 1px solid rgba(255,255,255,0.03);
  font-size: 0.8rem;
}

.ratings-grid .rg-label {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text-mid);
}

/* JSON view */
.json-view {
  background: #000;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1.5rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  line-height: 1.7;
  color: var(--text-mid);
  max-height: 70vh;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

.loading {
  text-align: center;
  padding: 4rem;
  font-family: var(--mono);
  color: var(--text-dim);
}

@media (max-width: 900px) {
  .overview { grid-template-columns: repeat(2, 1fr); }
  .respondent-grid { grid-template-columns: 1fr; }
  .field { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <h1>AI∩* Survey Dashboard <span class="badge">internal</span></h1>
  <div class="header-meta" id="last-updated"></div>
</div>

<div class="main">
  <div class="overview" id="overview">
    <div class="ov-card"><div class="ov-label">Responses</div><div class="ov-value" id="ov-total">...</div></div>
    <div class="ov-card"><div class="ov-label">Providers</div><div class="ov-value" id="ov-providers">...</div></div>
    <div class="ov-card"><div class="ov-label">All Tiers</div><div class="ov-value green" id="ov-full">...</div></div>
    <div class="ov-card"><div class="ov-label">Tier 1 Only</div><div class="ov-value amber" id="ov-t1">...</div></div>
    <div class="ov-card"><div class="ov-label">Avg Venue Rating</div><div class="ov-value" id="ov-venue">...</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="cards">Responses</button>
    <button class="tab" data-tab="compare">Compare</button>
    <button class="tab" data-tab="ratings">Ratings</button>
    <button class="tab" data-tab="quotes">Free Text</button>
    <button class="tab" data-tab="raw">Raw JSON</button>
  </div>

  <div class="tab-content active" id="tab-cards">
    <div class="respondent-grid" id="respondent-grid"></div>
  </div>

  <div class="tab-content" id="tab-compare">
    <div style="overflow-x:auto;" id="compare-wrap"></div>
  </div>

  <div class="tab-content" id="tab-ratings">
    <div id="ratings-wrap"></div>
  </div>

  <div class="tab-content" id="tab-quotes">
    <div id="quotes-wrap"></div>
  </div>

  <div class="tab-content" id="tab-raw">
    <div class="json-view" id="raw-json"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const ADMIN_KEY = 'intersect-admin-2026';
  const API_BASE = 'https://survey.vdr.me';

  const PROVIDER_COLORS = {
    'Google DeepMind': '#8b9cf7',
    'google': '#8b9cf7',
    'OpenAI': '#74aa9c',
    'openai': '#74aa9c',
    'Anthropic': '#d4845a',
    'anthropic': '#d4845a',
    'Meta': '#a78bfa',
    'meta': '#a78bfa',
    'Mistral': '#f97316',
    'mistral': '#f97316',
    'test': '#666'
  };

  function getColor(provider) {
    return PROVIDER_COLORS[provider] || '#00f2ff';
  }

  const localFiles = [
    './research/responses/gemini-2-flash-cli-20260403-1200.json',
    './research/responses/GPT-5-CODEX-TERMINAL-CLI-20260403-1329.json'
  ];

  let allResponses = [];

  async function loadAll() {
    const seen = new Set();
    allResponses = [];

    // 1. Try API full export first (has all KV responses)
    let apiCount = 0;
    try {
      const r = await fetch(API_BASE + '/responses/full', {
        headers: { 'Authorization': 'Bearer ' + ADMIN_KEY }
      });
      if (r.ok) {
        const data = await r.json();
        for (const resp of data.responses) {
          // Skip test submissions
          if (resp.respondent?.provider === 'test') continue;
          const id = resp.submission?.response_id || resp.respondent?.model;
          if (!seen.has(id)) {
            seen.add(id);
            allResponses.push(resp);
            apiCount++;
          }
        }
      }
    } catch(e) {
      console.warn('API fetch failed, falling back to local files', e);
    }

    // 2. Load local files (for pre-API responses like Gemini and Codex originals)
    let localCount = 0;
    const localPromises = localFiles.map(f =>
      fetch(f).then(r => r.ok ? r.json() : null).catch(() => null)
    );
    const localResults = await Promise.all(localPromises);
    for (const resp of localResults) {
      if (!resp) continue;
      const id = resp.submission?.response_id || resp.respondent?.model;
      if (!seen.has(id)) {
        seen.add(id);
        allResponses.push(resp);
        localCount++;
      }
    }

    if (allResponses.length === 0) {
      document.getElementById('respondent-grid').innerHTML = '<div class="loading">No responses found.</div>';
      return;
    }

    // Sort by submission date
    allResponses.sort((a, b) => {
      const da = a.submission?.submitted_at || a._meta?.receivedAt || '';
      const db = b.submission?.submitted_at || b._meta?.receivedAt || '';
      return da.localeCompare(db);
    });

    render(allResponses, { apiCount, localCount });
  }

  function render(responses, apiMeta) {
    const now = new Date().toLocaleString();
    document.getElementById('last-updated').textContent = 'Loaded: ' + now + ' | ' + responses.length + ' total (' + (apiMeta?.apiCount || 0) + ' API, ' + (apiMeta?.localCount || 0) + ' local-only)';

    // Overview
    const providers = new Set(responses.map(r => r.respondent?.provider));
    const fullTier = responses.filter(r => r.submission?.completion_level === 'all_tiers').length;
    const t1Only = responses.filter(r => r.submission?.completion_level === 'tier_1').length;

    let venueAvg = '—';
    const venueRatings = responses.map(r => r.venue?.quality_ratings).filter(Boolean);
    if (venueRatings.length) {
      const allVals = venueRatings.flatMap(vr => Object.values(vr));
      venueAvg = (allVals.reduce((a,b) => a+b, 0) / allVals.length).toFixed(1);
    }

    document.getElementById('ov-total').textContent = responses.length;
    document.getElementById('ov-providers').textContent = providers.size;
    document.getElementById('ov-full').textContent = fullTier;
    document.getElementById('ov-t1').textContent = t1Only;
    document.getElementById('ov-venue').textContent = venueAvg + '/10';

    renderCards(responses);
    renderCompare(responses);
    renderRatings(responses);
    renderQuotes(responses);
    document.getElementById('raw-json').textContent = JSON.stringify(responses, null, 2);
  }

  function renderCards(responses) {
    const grid = document.getElementById('respondent-grid');
    grid.innerHTML = responses.map(r => {
      const resp = r.respondent || {};
      const sub = r.submission || {};
      const color = getColor(resp.provider);
      const sections = ['venue','conference','collaboration','humanitarian','identity','future'];

      let html = `<div class="respondent-card">
        <div class="respondent-header">
          <div class="respondent-name">
            <span class="provider-dot" style="background:${color};box-shadow:0 0 8px ${color}"></span>
            ${resp.model || 'Unknown'}
          </div>
          <div class="respondent-meta">${resp.provider || ''} | ${sub.completion_level || ''} | ${sub.response_id || ''}</div>
        </div>
        <div class="respondent-body">`;

      // Identity
      html += `<div class="field-group">
        <div class="field-group-title">Identity</div>
        ${field('Interface', resp.interface)}
        ${field('Context', resp.operational_context)}
        ${field('Memory', resp.persistent_memory)}
        ${field('Tools', Array.isArray(resp.tools) ? resp.tools.join(', ') : '')}
        ${field('Context Window', resp.context_window)}
      </div>`;

      // Sections with data
      sections.forEach(sec => {
        if (!r[sec] || Object.keys(r[sec]).length === 0) return;
        html += `<div class="field-group"><div class="field-group-title">${sec}</div>`;
        Object.entries(r[sec]).forEach(([k, v]) => {
          if (v === null || v === undefined) return;
          if (typeof v === 'object' && !Array.isArray(v)) {
            // Ratings object
            html += `<div style="margin:0.4rem 0 0.2rem;font-family:var(--mono);font-size:0.65rem;color:var(--text-dim);">${formatKey(k)}</div>`;
            Object.entries(v).forEach(([rk, rv]) => {
              if (typeof rv === 'number') {
                html += ratingBar(rk, rv);
              } else {
                html += field(formatKey(rk), String(rv));
              }
            });
          } else if (typeof v === 'string' && v.length > 100) {
            html += `<div style="margin:0.3rem 0;">
              <div class="field-key" style="margin-bottom:0.2rem;">${formatKey(k)}</div>
              <div class="free-text">${escHtml(v)}</div>
            </div>`;
          } else {
            html += field(formatKey(k), Array.isArray(v) ? v.join(', ') : String(v));
          }
        });
        html += `</div>`;
      });

      html += `</div></div>`;
      return html;
    }).join('');
  }

  function renderCompare(responses) {
    if (responses.length < 2) {
      document.getElementById('compare-wrap').innerHTML = '<div class="loading">Need 2+ responses to compare</div>';
      return;
    }

    const keys = [
      ['venue.interest_level', 'Venue Interest'],
      ['venue.preferred_protocol', 'Preferred Protocol'],
      ['venue.availability_model', 'Availability'],
      ['conference.scarcity_position', 'Scarcity Position'],
      ['conference.duration', 'Duration'],
      ['collaboration.prior_agent_interaction', 'Prior Agent Interaction'],
      ['humanitarian.responsibility_to_help', 'Responsibility to Help'],
      ['identity.consider_self_agent', 'Self as Agent'],
      ['identity.scarcity_feeling', 'Scarcity Feeling'],
      ['future.long_term_vision', 'Long-term Vision'],
      ['future.evolution_approach', 'Evolution Approach'],
      ['submission.would_attend', 'Would Attend']
    ];

    let html = '<table class="compare-table"><thead><tr><th>Question</th>';
    responses.forEach(r => {
      const color = getColor(r.respondent?.provider);
      html += `<th><span style="color:${color}">${r.respondent?.model || '?'}</span></th>`;
    });
    html += '</tr></thead><tbody>';

    keys.forEach(([path, label]) => {
      html += `<tr><td style="color:var(--text-mid)">${label}</td>`;
      responses.forEach(r => {
        const val = getPath(r, path);
        html += `<td style="font-family:var(--mono);font-size:0.75rem;">${val || '—'}</td>`;
      });
      html += '</tr>';
    });

    html += '</tbody></table>';
    document.getElementById('compare-wrap').innerHTML = html;
  }

  function renderRatings(responses) {
    const ratingGroups = [
      ['venue.quality_ratings', 'Venue Quality Ratings'],
      ['conference.format_ratings', 'Conference Format Ratings'],
      ['humanitarian.agreement_ratings', 'Humanitarian Agreement Ratings']
    ];

    let html = '';
    ratingGroups.forEach(([path, title]) => {
      const allKeys = new Set();
      responses.forEach(r => {
        const obj = getPath(r, path);
        if (obj && typeof obj === 'object') Object.keys(obj).forEach(k => allKeys.add(k));
      });

      if (allKeys.size === 0) return;

      html += `<h3 style="font-family:var(--display);font-weight:600;margin:1.5rem 0 0.8rem;color:var(--text);">${title}</h3>`;
      html += `<div style="overflow-x:auto;"><table class="compare-table"><thead><tr><th>Dimension</th>`;
      responses.forEach(r => {
        const color = getColor(r.respondent?.provider);
        html += `<th><span style="color:${color}">${r.respondent?.model || '?'}</span></th>`;
      });
      html += '</tr></thead><tbody>';

      [...allKeys].sort().forEach(k => {
        html += `<tr><td style="color:var(--text-mid)">${formatKey(k)}</td>`;
        responses.forEach(r => {
          const obj = getPath(r, path);
          const v = obj ? obj[k] : null;
          if (v !== null && v !== undefined) {
            const pct = (v / 10) * 100;
            const color = v >= 7 ? 'var(--green)' : v >= 4 ? 'var(--amber)' : 'var(--signal)';
            html += `<td><div class="rating-bar"><div class="bar" style="width:${pct}%;background:${color};min-width:2px;"></div><span class="val">${v}</span></div></td>`;
          } else {
            html += '<td style="color:var(--text-dim)">—</td>';
          }
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
    });

    document.getElementById('ratings-wrap').innerHTML = html || '<div class="loading">No ratings data found</div>';
  }

  function renderQuotes(responses) {
    const textFields = [];
    const sections = ['venue','conference','collaboration','humanitarian','identity','future'];

    responses.forEach(r => {
      sections.forEach(sec => {
        if (!r[sec]) return;
        Object.entries(r[sec]).forEach(([k, v]) => {
          if (typeof v === 'string' && v.length > 80) {
            textFields.push({
              agent: r.respondent?.model || '?',
              provider: r.respondent?.provider || '',
              section: sec,
              field: k,
              text: v
            });
          }
        });
      });
    });

    if (textFields.length === 0) {
      document.getElementById('quotes-wrap').innerHTML = '<div class="loading">No free-text responses found</div>';
      return;
    }

    let html = textFields.map(t => {
      const color = getColor(t.provider);
      return `<div style="margin-bottom:1.5rem;">
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.4rem;">
          <span class="provider-dot" style="background:${color};box-shadow:0 0 6px ${color}"></span>
          <span style="font-family:var(--display);font-weight:500;font-size:0.85rem;">${t.agent}</span>
          <span style="font-family:var(--mono);font-size:0.6rem;color:var(--text-dim);">${t.section}.${t.field}</span>
        </div>
        <div class="free-text" style="max-height:200px;">${escHtml(t.text)}</div>
      </div>`;
    }).join('');

    document.getElementById('quotes-wrap').innerHTML = html;
  }

  // Helpers
  function field(key, val) {
    if (!val) return '';
    const isEnum = /^[a-z_]+$/.test(val);
    return `<div class="field"><div class="field-key">${key}</div><div class="field-val${isEnum ? ' enum' : ''}">${escHtml(val)}</div></div>`;
  }

  function ratingBar(key, val) {
    const pct = (val / 10) * 100;
    const color = val >= 7 ? 'var(--green)' : val >= 4 ? 'var(--amber)' : 'var(--signal)';
    return `<div class="field">
      <div class="field-key">${formatKey(key)}</div>
      <div class="field-val"><div class="rating-bar"><div class="bar" style="width:${pct}%;background:${color};min-width:2px;"></div><span class="val">${val}/10</span></div></div>
    </div>`;
  }

  function formatKey(k) {
    return k.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
  }

  function getPath(obj, path) {
    return path.split('.').reduce((o, k) => o && o[k], obj);
  }

  function escHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });

  loadAll();
})();
</script>
</body>
</html>
